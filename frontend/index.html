<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="JanSetu — Turning citizen voices into ranked, explainable public investment decisions. AI-powered platform for Digital Public Infrastructure & Governance." />
    <title>JanSetu — AI for Digital Public Infrastructure</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,340;9..144,480;9..144,600&family=Space+Grotesk:wght@400;500;600&display=swap" rel="stylesheet" />
    <!-- Google Identity Services SDK -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <style>
      .bridge-arc {
        stroke-dasharray: 63;
        stroke-dashoffset: 63;
        animation: bridgeDraw 1.4s ease-in-out infinite;
      }
      @keyframes bridgeDraw {
        0%   { stroke-dashoffset: 63;  opacity: 0.3; }
        50%  { stroke-dashoffset: 0;   opacity: 1;   }
        100% { stroke-dashoffset: -63; opacity: 0.3; }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div style="display:flex; flex-direction:column; justify-content:center; align-items:center; height:100vh; width:100vw; background:linear-gradient(180deg, #EFF9EE 0%, #FFFFFF 100%); gap: 1.25rem;">
        <div class="jansetu-loader">
          <svg viewBox="0 0 64 64" fill="none" width="95" height="95">
            <circle cx="32" cy="32" r="30" fill="#EFF9EE" stroke="#C9EAC7" stroke-width="1.5" />
            <path class="bridge-arc" d="M12 34 Q32 12 52 34" 
                  stroke="#1F3A24" stroke-width="5" stroke-linecap="round" fill="none"/>
            <line x1="10" y1="43" x2="54" y2="43" 
                  stroke="#25D366" stroke-width="3" stroke-linecap="round"/>
          </svg>
        </div>
        <div style="font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 1.35rem; font-weight: 800; color: #1F3A24; letter-spacing: 0.03em;">
          JanSetu <span style="color: #25D366;">AI</span>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
